# Cal.com self-hosted para HUB Startidea
# Coolify v3 · cal.hubstartidea.es
#
# Tres servicios:
# - cal-web: la app Next.js de Cal.com
# - cal-db: Postgres 16 dedicado (NO usar el de hub-startidea-web ni el de luciérnaga)
# - cal-redis: Redis para caching/sessions
#
# Variables sensibles → Coolify Environment Variables (no commit).
# Variables públicas → este archivo directamente.

services:
  cal-web:
    image: calcom/cal.com:v6.2.0
    environment:
      # Postgres
      DATABASE_URL: postgresql://calcom:${POSTGRES_PASSWORD}@cal-db:5432/calcom
      DATABASE_DIRECT_URL: postgresql://calcom:${POSTGRES_PASSWORD}@cal-db:5432/calcom

      # Auth — generados con openssl rand
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://cal.hubstartidea.es
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}

      # URLs públicas
      NEXT_PUBLIC_WEBAPP_URL: https://cal.hubstartidea.es
      NEXT_PUBLIC_API_V2_URL: https://cal.hubstartidea.es/api/v2

      # Email vía Resend SMTP (reutiliza la cuenta del HUB)
      EMAIL_FROM: hello@hubstartidea.es
      EMAIL_FROM_NAME: HUB Startidea
      EMAIL_SERVER_HOST: smtp.resend.com
      EMAIL_SERVER_PORT: 465
      EMAIL_SERVER_USER: resend
      EMAIL_SERVER_PASSWORD: ${RESEND_API_KEY}

      # Operativa
      NODE_ENV: production
      NEXT_PUBLIC_TELEMETRY_KEY: ""
      CALCOM_TELEMETRY_DISABLED: "1"

      # Licencia (Cal.com es open source MIT, NO requiere licencia
      # para self-host hasta cierto nº de usuarios. Para teams >3
      # usuarios habría que sacar licencia comercial; para uso del HUB
      # con 1-2 admins es libre).
      CALCOM_LICENSE_KEY: ""
      NEXT_PUBLIC_LICENSE_CONSENT: "agree"
    depends_on:
      cal-db:
        condition: service_healthy
      cal-redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  cal-db:
    # postgres:16-alpine — el bitnami de Coolify v3 está roto (memoria
    # incident reference_coolify_v3_bitnami_broken). Mismo patrón que
    # mentor-db y hub-db.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: calcom
    volumes:
      - cal-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calcom -d calcom"]
      interval: 10s
      timeout: 5s
      retries: 5

  cal-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - cal-redis-data:/data
    restart: unless-stopped

volumes:
  cal-db-data:
  cal-redis-data:
