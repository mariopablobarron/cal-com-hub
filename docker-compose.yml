# Cal.com self-hosted para HUB Startidea
# Coolify v3 · cal.hubstartidea.es
#
# IMPORTANTE — Coolify v3 quirk: las env vars deben definirse en el panel
# Environment Variables, no como literales en este yml. Las vars con valor
# hardcoded en el `environment:` se ignoran al levantar el container.
# Por eso TODO va aquí como ${VAR_NAME} — el panel inyecta los valores.

services:
  cal-web:
    image: calcom/cal.com:v6.2.0
    # Labels Traefik — Coolify v3 con docker-compose NO genera labels
    # automáticamente, hay que ponerlas manualmente. Patrón copiado de
    # otras apps del VPS que funcionan (startidea-merch).
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # HTTPS principal
      - "traefik.http.routers.cal-web.rule=Host(`cal.hubstartidea.es`)"
      - "traefik.http.routers.cal-web.entrypoints=websecure"
      - "traefik.http.routers.cal-web.tls=true"
      - "traefik.http.routers.cal-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cal-web.service=cal-web"
      - "traefik.http.services.cal-web.loadbalancer.server.port=3000"
      # HTTP → redirect a HTTPS
      - "traefik.http.middlewares.cal-web-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.cal-web-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.cal-web-http.rule=Host(`cal.hubstartidea.es`)"
      - "traefik.http.routers.cal-web-http.entrypoints=web"
      - "traefik.http.routers.cal-web-http.middlewares=cal-web-redirect"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL}
      NEXT_PUBLIC_API_V2_URL: ${NEXT_PUBLIC_API_V2_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD}
      NODE_ENV: ${NODE_ENV}
      CALCOM_TELEMETRY_DISABLED: ${CALCOM_TELEMETRY_DISABLED}
      NEXT_PUBLIC_LICENSE_CONSENT: ${NEXT_PUBLIC_LICENSE_CONSENT}
    depends_on:
      cal-db:
        condition: service_healthy
      cal-redis:
        condition: service_started
    restart: unless-stopped
    # Cal.com v6.2.0 NO tiene /api/health endpoint (404). Usamos / (root)
    # que devuelve 200 cuando Next.js está sirviendo.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  cal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cal-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calcom -d calcom"]
      interval: 10s
      timeout: 5s
      retries: 5

  cal-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - cal-redis-data:/data
    restart: unless-stopped

volumes:
  cal-db-data:
  cal-redis-data:
